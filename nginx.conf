server_tokens off;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Container health probe
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets can be cached forever.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # EPUB files: keep the correct MIME type; `expires` adds a 30-day Cache-Control.
    location ~* \.epub$ {
        default_type application/epub+zip;
        try_files $uri =404;
        expires 30d;
    }

    # Covers and images.
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|avif|woff2?)$ {
        try_files $uri =404;
        expires 30d;
    }

    # Never cache the SPA entry point.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA history fallback: /library, /books/:slug, /read/:slug, ...
    location / {
        try_files $uri $uri/ /index.html;
    }
}

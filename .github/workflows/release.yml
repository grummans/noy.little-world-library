# Release pipeline — Little World Library
#
# Flow:
#   dev  ──► lint + security + build image  ──► ghcr.io/…:dev
#   main ──► lint + security + build image  ──► ghcr.io/…:main, :latest
#   tag v*.*.* ─────────────────────────────► ghcr.io/…:1.2.3, :sha-<commit>, :latest
#   pull_request ───────────────────────────► validate only; never push
#
# The image is built locally and scanned by Trivy before it is pushed to GHCR.
# A release is blocked only by fixable HIGH or CRITICAL vulnerabilities.
#
# Notes:
#   - Personal repositories do not require GITLEAKS_LICENSE; organizations do.
#   - The single linux/amd64 platform is intentional: it permits a mandatory
#     pre-publication image scan. Multi-architecture publishing needs a different scan flow.

name: Release

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Least-privilege defaults. Individual jobs elevate permissions only when required.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR builds, but let branch and release builds finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '24'
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64

jobs:
  # ---------------------------------------------------------------------------
  # 1. Source quality
  # ---------------------------------------------------------------------------
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Type-check (vue-tsc)
        run: npm run type-check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------------------
  # 2. Committed-secret scanning
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required only for organization-owned repositories.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ---------------------------------------------------------------------------
  # 3. CodeQL SAST (available to public repositories)
  # ---------------------------------------------------------------------------
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  # ---------------------------------------------------------------------------
  # 4. Dependency-change review (pull requests only)
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # ---------------------------------------------------------------------------
  # 5. Dockerfile linting
  # ---------------------------------------------------------------------------
  dockerfile:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  # ---------------------------------------------------------------------------
  # 6. Repository scan (lockfile, misconfiguration, and secrets). Results are
  #    reported to the Security tab but do not block a release.
  # ---------------------------------------------------------------------------
  scan-filesystem:
    name: Trivy (filesystem)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan repository
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: '0'

      - name: Upload results to code scanning
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ---------------------------------------------------------------------------
  # 7. Build the image, scan it, then push it to GitHub Container Registry.
  # ---------------------------------------------------------------------------
  build:
    name: Build & push image
    needs: [quality, secrets, dockerfile]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # GHCR requires lower-case image names.
      - name: Normalize image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Little World Library
            org.opencontainers.image.description=Personal ebook library for reading in the browser
            org.opencontainers.image.licenses=MIT

      # Build locally before publication so Trivy can scan the exact image.
      # `load: true` supports one platform only; multi-architecture publishing
      # requires a different pre-publication scan strategy.
      - name: Build (local, for scanning)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The Docker exporter does not support attestations.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Print findings in the workflow log before enforcing the SARIF policy.
      # SARIF is designed for code-scanning upload and does not show findings clearly.
      - name: Report image findings (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          format: table
          # Always complete this diagnostic scan so the gate below controls publication.
          exit-code: '0'

      - name: Enforce image security policy (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          format: sarif
          output: trivy-image.sarif
          # Block publication when fixable HIGH or CRITICAL vulnerabilities exist.
          exit-code: '1'

      - name: Upload image scan results
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Push only for non-PR events after the scan has passed.
      - name: Push to GHCR
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Attach SBOM and build-provenance attestations to the image.
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### 🚀 Published image"
            echo ""
            echo "**Digest:** \`$DIGEST\`"
            echo ""
            echo "| Tag |"
            echo "| --- |"
            printf '%s\n' "$TAGS" | sed 's/^/| `/; s/$/` |/'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 8. Create a GitHub Release when a v1.2.3 tag is pushed.
  # ---------------------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            Container image:

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
